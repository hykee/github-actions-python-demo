name: Python Hello Demo
on: 
  push:
    branches: 
      - main
  workflow_dispatch:
jobs:
  build :
    runs-on : ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkput@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run hello.py
        run: python hello.py  
